name: Ecoplate CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Backend Tests
      working-directory: ./food-waste-backend
      run: mvn clean test
      
    - name: Generate Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Backend Test Results
        path: food-waste-backend/target/surefire-reports/*.xml
        reporter: java-junit
        
    - name: Upload Coverage Report
      uses: codecov/codecov-action@v4
      with:
        files: ./food-waste-backend/target/site/jacoco/jacoco.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ecoplate-frontend/package-lock.json
        
    - name: Install Dependencies
      working-directory: ./ecoplate-frontend
      run: npm ci
      
    - name: Run Frontend Tests
      working-directory: ./ecoplate-frontend
      run: npm run test:run
      
    - name: Generate Coverage Report
      working-directory: ./ecoplate-frontend
      run: npm run test:coverage
      
    - name: Upload Frontend Coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./ecoplate-frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
        
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ecoplate-frontend/package-lock.json
        
    - name: Install Dependencies
      working-directory: ./ecoplate-frontend
      run: npm ci
      
    - name: Build Frontend
      working-directory: ./ecoplate-frontend
      run: npm run build
      
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build Backend
      working-directory: ./food-waste-backend
      run: mvn clean package -DskipTests
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: food-waste-backend/target/*.jar

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Trigger Render Deployment
      env:
        HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "$HOOK" ]; then
          echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy."
          exit 0
        fi
        curl -fsSL -X POST "$HOOK"
      
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.VERCEL_ENABLED == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./ecoplate-frontend
        vercel-args: '--prod'
