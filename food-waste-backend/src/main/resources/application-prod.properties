# Production Application Configuration
spring.application.name=food-waste-backend
server.port=${PORT:8080}

# PostgreSQL Database Configuration - PRODUCTION
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration for Production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS Configuration - Will be set via environment variable
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://ecoplate-frontend.vercel.app}

# Logging Configuration - Reduced for production
logging.level.org.springframework.security=INFO
logging.level.com.foodwaste.backend=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
