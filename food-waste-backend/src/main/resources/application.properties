# Application Configuration
spring.application.name=food-waste-backend
server.port=8080

# MySQL Database Configuration
# allowPublicKeyRetrieval=true allows connection to MySQL 8.0 with caching_sha2_password
spring.datasource.url=jdbc:mysql://localhost:3306/food_waste_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Dev only. Production reads JWT_SECRET from the environment.
jwt.secret=${JWT_SECRET:local-development-only-secret-do-not-use-in-production-32chars}
jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.foodwaste.backend=DEBUG