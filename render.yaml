# Render Blueprint — New → Blueprint → point at this repo.
# Free tier: sleeps after ~15 min idle, cold start ~50s.
services:
  - type: web
    name: ecoplate-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon JDBC URL, e.g. jdbc:postgresql://host/db?sslmode=require&user=..&password=..
      - key: DATABASE_URL
        sync: false
      # Generate once; the prod profile has no fallback and will refuse to boot without it.
      - key: JWT_SECRET
        generateValue: true
      # Set to the deployed frontend origin after Vercel is up.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
